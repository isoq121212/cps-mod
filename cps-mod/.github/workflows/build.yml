name: Build CPS Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
      - run: chmod +x cps-mod/gradlew
      - run: cd cps-mod && ./gradlew build
      - uses: actions/upload-artifact@v3
        with:
          name: cpsmod-1.0.0
          path: cps-mod/build/libs/cpsmod-1.0.0.jar
