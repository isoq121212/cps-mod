plugins {
    id 'fabric-loom' version '0.9-SNAPSHOT'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_8
targetCompatibility = JavaVersion.VERSION_8

archivesBaseName = "cpsmod"
version = "1.0.0"
group = "com.cpsmod"

repositories {
    // Fabric репозиторий
}

dependencies {
    // Minecraft 1.16.5
    minecraft "com.mojang:minecraft:1.16.5"
    mappings "net.fabricmc:yarn:1.16.5+build.10:v2"

    // Fabric Loader и API
    modImplementation "net.fabricmc:fabric-loader:0.11.7"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.40.8+1.16"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 8
}

jar {
    from("LICENSE") {
        rename { "${it}_${archivesBaseName}" }
    }
}
